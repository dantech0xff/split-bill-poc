version: 2
updates:
  # Libraries and Gradle plugins from gradle/libs.versions.toml.
  # A version bump also needs new checksums in gradle/verification-metadata.xml. The workflow
  # checksums.yml works them out for each of these pull requests; docs/architecture.md says how
  # to take them over.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The AI proxy's packages in proxy/package.json, which are pinned to exact versions.
  - package-ecosystem: npm
    directory: /proxy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The web app's packages in web/package.json, pinned the same way; the Worker serves its build.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The types of the Node that builds and tests the pages, 22 in CI and in "engines". A newer
      # major would type APIs that Node 22 does not have; it comes with a move to that Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The actions in .github/workflows, which are pinned by commit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
