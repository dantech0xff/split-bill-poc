version: 2
updates:
  # Libraries and Gradle plugins from gradle/libs.versions.toml.
  # A version bump also needs new checksums in gradle/verification-metadata.xml; the README says how.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The actions in .github/workflows, which are pinned by commit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
