name: CI

# Runs for every branch of this repository and for pull requests from forks.
# Nothing here reads a secret, signs or deploys, so code from a fork can run it safely.
# Signing and publishing live in a separate workflow that needs a maintainer's approval.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Style, tests, lint and packages
    # A pull request from a branch of this repository already ran when that branch was pushed.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Also checks that the Gradle wrapper in the repository is a genuine one.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Code style
        run: ./gradlew ktlintCheck

      # The unit tests include the screenshot comparison against app/src/test/screenshots.
      - name: Unit tests and screenshots
        run: ./gradlew :core:domain:test :app:testProdDebugUnitTest

      - name: Android Lint
        run: ./gradlew :app:lintProdDebug

      # No signing variables exist here, so the release package and bundle come out unsigned.
      - name: Debug package, release package and bundle
        run: ./gradlew :app:assembleProdDebug :app:assembleProdRelease :app:bundleProdRelease

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/reports/tests/
            **/reports/lint-results-*
            app/src/test/screenshots/*_compare.png
            app/src/test/screenshots/*_actual.png
          retention-days: 7

  secrets:
    name: Secret scan
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: a secret that was committed and later removed is still exposed.
          fetch-depth: 0

      - name: Scan every commit for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --silent --show-error --fail --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner
