name: CI

# Runs for every pull request, including one from a fork, and for every push to main.
# A pull request is tested as it would look after merging, which a run on the branch alone is not.
# Nothing here reads a secret, signs or deploys, so code from a fork can run it safely.
# Signing and publishing belong in a separate workflow that a maintainer approves; it does not exist yet.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Style, tests, lint and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Also checks that the Gradle wrapper in the repository is a genuine one.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Code style
        run: ./gradlew ktlintCheck

      # The unit tests include the screenshot comparison against app/src/test/screenshots.
      - name: Unit tests and screenshots
        run: ./gradlew :core:domain:test :core:designsystem:testDebugUnitTest :app:testProdDebugUnitTest

      - name: Android Lint
        run: ./gradlew :app:lintProdDebug :core:designsystem:lintDebug

      # No signing variables exist here, so the release package and bundle come out unsigned.
      - name: Debug package, release package and bundle
        run: ./gradlew :app:assembleProdDebug :app:assembleProdRelease :app:bundleProdRelease

      # These only run on an emulator, nightly. Compiling them here catches a break before it merges.
      - name: Dev flavor, device tests and profile module compile
        run: ./gradlew :app:assembleDevDebug :app:assembleProdDebugAndroidTest :baseline-profile:assembleProdNonMinifiedRelease

      # The AI runs behind the proxy. No package may carry an Anthropic library or key again.
      - name: No Anthropic code in the packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(app/build/outputs/apk/prod/release/*.apk app/build/outputs/bundle/prodRelease/*.aab app/build/outputs/apk/dev/debug/*.apk)
          if [ "${#packages[@]}" -ne 3 ]; then
            echo "Expected the release package, the bundle and the dev package, found ${#packages[@]} files"
            exit 1
          fi
          for package in "${packages[@]}"; do
            # Unpacked first: a grep that stops at its first match would end the pipe early.
            unzip -p "$package" '*.dex' > classes.bin
            if grep -aq 'Lcom/anthropic/' classes.bin; then
              echo "$package holds classes of com.anthropic"
              exit 1
            fi
          done
          rm classes.bin

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          # outputs/roborazzi holds the side-by-side image of every screenshot that changed.
          path: |
            **/reports/tests/
            **/reports/lint-results-*
            **/outputs/roborazzi/
          retention-days: 7

  proxy:
    name: AI proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            proxy/package-lock.json
            web/package-lock.json

      # Exactly the versions in the lock file, so a test run cannot pick up a new release.
      - name: Packages
        run: npm ci

      # The web app the Worker serves, from exactly the versions in web/'s own lock file. The
      # typecheck and the tests put it into the Worker; without a lock file in web/ they use the
      # placeholder page the proxy makes instead.
      - name: Web app
        run: |
          if [ ! -f ../web/package-lock.json ]; then
            echo "web/ has no package-lock.json: the proxy is checked with its placeholder page."
            exit 0
          fi
          npm ci --prefix ../web
          npm run build:web
          # The pages' own tests: every state, the link filter, money, claims and the live connection.
          npm test --prefix ../web

      # Generates the binding types from wrangler.jsonc, then checks every file.
      - name: Types
        run: npm run typecheck

      # The Worker and its Durable Objects run in the workers runtime, against a fake model.
      - name: Tests
        run: npm test

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: a secret that was committed and later removed is still exposed.
          fetch-depth: 0

      - name: Scan every commit for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --silent --show-error --fail --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner
