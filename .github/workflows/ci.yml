name: CI

# Runs for every pull request, including one from a fork, and for every push to main.
# A pull request is tested as it would look after merging, which a run on the branch alone is not.
# Nothing here reads a secret, signs or deploys, so code from a fork can run it safely.
# release.yml calls it to run the same checks on the commit of a release, before anything is signed.
# The secret scan and the dependency review are in security.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Style, tests, lint and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Also checks that the Gradle wrapper in the repository is a genuine one.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Code style
        run: ./gradlew ktlintCheck

      # The unit tests include the screenshot comparison against app/src/test/screenshots.
      - name: Unit tests and screenshots
        run: ./gradlew :core:domain:test :core:designsystem:testDebugUnitTest :app:testProdDebugUnitTest

      - name: Android Lint
        run: ./gradlew :app:lintProdDebug :core:designsystem:lintDebug

      # No signing variables exist here, so the release package and bundle come out unsigned.
      - name: Debug package, release package and bundle
        run: ./gradlew :app:assembleProdDebug :app:assembleProdRelease :app:bundleProdRelease

      # These only run on an emulator, nightly. Compiling them here catches a break before it merges.
      - name: Dev flavor, device tests and profile module compile
        run: ./gradlew :app:assembleDevDebug :app:assembleProdDebugAndroidTest :baseline-profile:assembleProdNonMinifiedRelease

      # The AI runs behind the proxy. No package may carry an Anthropic library or key again.
      - name: No Anthropic code in the packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(app/build/outputs/apk/prod/release/*.apk app/build/outputs/bundle/prodRelease/*.aab app/build/outputs/apk/dev/debug/*.apk)
          if [ "${#packages[@]}" -ne 3 ]; then
            echo "Expected the release package, the bundle and the dev package, found ${#packages[@]} files"
            exit 1
          fi
          for package in "${packages[@]}"; do
            # Unpacked first: a grep that stops at its first match would end the pipe early.
            unzip -p "$package" '*.dex' > classes.bin
            if grep -aq 'Lcom/anthropic/' classes.bin; then
              echo "$package holds classes of com.anthropic"
              exit 1
            fi
          done
          rm classes.bin

      # aapt2 and d8 for the release checks and their tests, at the version release.yml uses.
      - name: Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0" > /dev/null
          echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_ENV"

      # The checks themselves, against a package made like a release and deliberately bad ones.
      - name: Tests of the release checks
        run: python3 scripts/release-checks.test.py

      # Not debuggable, no plain HTTP, no secret key. This package is built without a proxy
      # address, so the check of that address runs only in release.yml, which has one.
      - name: Release checks
        run: python3 scripts/release-checks.py app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          # outputs/roborazzi holds the side-by-side image of every screenshot that changed.
          path: |
            **/reports/tests/
            **/reports/lint-results-*
            **/outputs/roborazzi/
          retention-days: 7

  proxy:
    name: AI proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            proxy/package-lock.json
            web/package-lock.json

      # Exactly the versions in the lock file, so a test run cannot pick up a new release.
      - name: Packages
        run: npm ci

      # Known vulnerabilities of high or critical severity in the packages of the proxy and of the
      # web app, development ones included: they run here and in the release, next to its token.
      - name: Audit packages
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix ../web

      # The web app the Worker serves, from exactly the versions in web/'s own lock file. The
      # typecheck and the tests put it into the Worker; without a lock file in web/ they use the
      # placeholder page the proxy makes instead.
      - name: Web app
        run: |
          if [ ! -f ../web/package-lock.json ]; then
            echo "web/ has no package-lock.json: the proxy is checked with its placeholder page."
            exit 0
          fi
          npm ci --prefix ../web
          # Builds the web app into the Worker, then the bundle a deploy uploads, without deploying:
          # it fails rather than bundle the placeholder page.
          npm run bundle -- "$RUNNER_TEMP/bundle"
          # The pages' own tests: every state, the link filter, money, claims and the live connection.
          npm test --prefix ../web

      # Generates the binding types from wrangler.jsonc, then checks every file.
      - name: Types
        run: npm run typecheck

      # The Worker and its Durable Objects run in the workers runtime, against a fake model. Node then
      # runs the tests of the evaluation runner, which must never leave its local proxy running.
      - name: Tests
        run: npm test
