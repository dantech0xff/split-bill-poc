name: Device tests

# The work that needs a real Android runtime. Gradle starts its own emulator for it.
# It runs every night, on request, and whenever the device tests, the profile module, the
# dependencies or this workflow change.
on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - app/src/androidTest/**
      - baseline-profile/**
      - gradle/libs.versions.toml
      - gradle/verification-metadata.xml
      - .github/workflows/device-tests.yml

permissions:
  contents: read

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Starting the app, the keystore, ML Kit text recognition and the HTTP client.
          - name: Tests on an Android 14 emulator
            task: :app:pixel6Api34ProdDebugAndroidTest
          # Records which code runs at startup, so a release can ship it precompiled.
          - name: Record the baseline profile
            task: :app:generateProdReleaseBaselineProfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      # Without this the emulator cannot use the runner's hardware virtualisation and is far too slow.
      - name: Let the emulator use hardware virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: ${{ matrix.name }}
        run: >
          ./gradlew ${{ matrix.task }}
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      # Only the recording job keeps it. Every checkout holds the committed profile, so without
      # this condition the test job would upload that old copy under the same name.
      - name: Keep the recorded profile
        if: matrix.task == ':app:generateProdReleaseBaselineProfile'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profile
          path: app/src/*/generated/baselineProfiles/
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ strategy.job-index }}
          path: |
            **/reports/androidTests/
            **/outputs/androidTest-results/
          retention-days: 7
