<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New split before a bill is added</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F6F4; color: #111114; font-family: 'Be Vietnam Pro', system-ui, sans-serif; padding: 52px 20px 0; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; align-items: center; gap: 12px; height: 48px">
<a href="HomeEmpty.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #111114; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Arial Black', system-ui, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em">New split</h1>
</header>

<div style="height: 232px; box-sizing: border-box; border-radius: 28px; background: #E7E6E0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center">
<svg width="56" height="64" viewBox="0 0 56 64" fill="none" aria-hidden="true"><rect x="2" y="2" width="52" height="60" rx="10" stroke="#111114" stroke-width="2" stroke-dasharray="6 5"></rect><path d="M16 22h24M16 32h24M16 42h14" stroke="#111114" stroke-width="2.4" stroke-linecap="round"></path></svg>
<h2 style="margin: 4px 0 0; font-family: 'Bricolage Grotesque', 'Arial Black', system-ui, sans-serif; font-weight: 800; font-size: 22px; line-height: 28px; letter-spacing: -0.01em">Add the bill</h2>
<p style="margin: 0; max-width: 290px; font-size: 14px; line-height: 20px; color: #5F5E66">Scan it or take a photo. The text is read on this phone; the photo itself is never uploaded.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button style="height: 72px; border: none; border-radius: 20px; background: #111114; color: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"></path></svg>
<span>Scan the bill</span>
</button>
<button style="height: 72px; border: none; border-radius: 20px; background: #FFFFFF; color: #111114; font-family: inherit; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13.5" r="3.5"></circle></svg>
<span>Take photo</span>
</button>
<button style="height: 72px; border: none; border-radius: 20px; background: #FFFFFF; color: #111114; font-family: inherit; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8.5" cy="10" r="1.5"></circle><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"></path></svg>
<span>Choose photos</span>
</button>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 24px; height: 44px">
<button style="border: none; background: none; padding: 0; height: 44px; color: #111114; font-family: inherit; font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Use the sample bill</button>
<button style="border: none; background: none; padding: 0; height: 44px; color: #111114; font-family: inherit; font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Type it in by hand</button>
</div>

<sc-if value="{{ aiOff }}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 13px; background: #FFD23F; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111114" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg>
</span>
<p style="margin: 0; font-size: 14px; line-height: 20px">Reading bills with AI is not set up in this build of the app.</p>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="how" style="font-family: 'Bricolage Grotesque', 'Arial Black', system-ui, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.01em">How should it be split?</label>
<textarea id="how" rows="2" style="box-sizing: border-box; width: 100%; height: 80px; resize: none; border: 1.5px solid #8A8992; border-radius: 20px; background: #FFFFFF; padding: 14px 16px; font-family: inherit; font-size: 16px; line-height: 24px; color: #111114">Split this bill</textarea>
<span style="font-size: 13px; line-height: 18px; color: #5F5E66">For example: Split with Minh and Lan. Minh had the beers.</span>
</div>

<button disabled="disabled" style="position: absolute; left: 20px; bottom: 24px; width: 350px; height: 56px; box-sizing: border-box; border: none; border-radius: 28px; background: #D9D8D2; color: #5F5E66; font-family: inherit; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#5F5E66" aria-hidden="true"><path d="M12 2l2.2 6.3L20.5 10.5l-6.3 2.2L12 19l-2.2-6.3L3.5 10.5l6.3-2.2L12 2z"></path><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"></path></svg>
<span>Read and split the bill</span>
</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"aiOff":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { aiOff: this.props.aiOff ?? false };
}
}
</script>
</body>
</html>
